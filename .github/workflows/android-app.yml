name: Android app

# Builds an installable Android app (APK). Download it from the workflow run
# page (Actions → Android app → latest run → Artifacts) while signed in to GitHub.
# The app loads the live site, so this only needs re-running when the app
# shell changes (icons, permissions, APP_URL), not for normal updates.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "mobile/**"
      - "assets/**"
      - ".github/workflows/android-app.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Set an APP_URL repository variable (Settings → Secrets and variables →
      # Actions → Variables) once you have an https domain.
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Copy app config into the Android project
        run: bunx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../25.apk

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: 25-android
          path: 25.apk
          retention-days: 30
